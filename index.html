<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Brasília & Clima Google</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #e8eaed; 
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-family: Roboto, Arial, sans-serif;
            padding: 20px;
        }

        #relogio {
            color: #ffffff; 
            font-size: 7.5em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            white-space: nowrap; 
            padding: 0 10px;
            text-align: center;
            margin-bottom: 25px;
        }

        /* ----------------------------------------------------------------- */
        /* ESTILO DO CARD DO GOOGLE CLIMA */
        /* ----------------------------------------------------------------- */
        #previsao-container {
            background-color: #17191c;
            color: #e8eaed;
            max-width: 580px;
            width: 100%;
            padding: 22px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        /* Barra de localização e seletor */
        .topo-localizacao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #9aa0a6;
            border-bottom: 1px solid #2d3139;
            padding-bottom: 12px;
        }

        .local-info {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #e8eaed;
            font-weight: 500;
        }

        .btn-escolher {
            background: none;
            border: none;
            color: #8ab4f8;
            cursor: pointer;
            font-size: 0.95em;
            padding: 0;
        }

        .btn-escolher:hover {
            text-decoration: underline;
        }

        /* Caixa de input oculta para digitar a cidade */
        #painel-busca {
            display: none;
            margin-bottom: 15px;
            gap: 8px;
        }

        #painel-busca input {
            flex: 1;
            background: #202124;
            border: 1px solid #5f6368;
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.9em;
        }

        #painel-busca button {
            background: #8ab4f8;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            color: #202124;
            font-weight: bold;
            cursor: pointer;
        }

        h2.titulo-secao {
            font-size: 1.4em;
            font-weight: 400;
            margin: 0 0 16px 0;
            color: #e8eaed;
        }

        /* Seção Agora (Temperatura grande + Ícone) */
        .bloco-agora {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .temp-principal-box {
            display: flex;
            align-items: flex-start;
        }

        .numero-temperatura {
            font-size: 4.5em;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -2px;
        }

        .icone-grande {
            font-size: 3.5em;
            margin-left: 10px;
        }

        .detalhes-celestial {
            text-align: right;
        }

        .condicao-texto {
            font-size: 1.25em;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .sensacao-termica {
            font-size: 0.9em;
            color: #9aa0a6;
        }

        /* Alerta meteorológico (Estilo Google) */
        .alerta-caixa {
            background-color: #3c2427;
            border-left: 4px solid #f28b82;
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85em;
            color: #f6aea9;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Previsão por hora (Horária) */
        .previsao-horas {
            display: flex;
            justify-content: space-between;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2d3139;
            text-align: center;
        }

        .hora-coluna {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 45px;
            font-size: 0.85em;
            color: #9aa0a6;
        }

        .hora-coluna .temp-h {
            color: #e8eaed;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .hora-coluna .icone-h {
            font-size: 1.3em;
            margin-bottom: 8px;
        }

        /* Previsão Diária (Cards de Dias da Semana) */
        .previsao-dias {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .dia-card {
            background-color: #202124;
            border: 1px solid transparent;
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            flex: 1;
            min-width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.2s;
        }

        .dia-card.ativo {
            border-color: #8ab4f8;
            background-color: #282a2d;
        }

        .dia-nome {
            font-size: 0.8em;
            color: #9aa0a6;
            margin-bottom: 8px;
            text-transform: lowercase;
        }

        .dia-icone {
            font-size: 1.4em;
            margin-bottom: 10px;
        }

        .dia-temp {
            font-size: 0.8em;
            color: #e8eaed;
            font-weight: 500;
            line-height: 1.3;
        }

        .dia-temp .min {
            color: #9aa0a6;
        }

        /* ----------------------------------------------------------------- */
        /* RESPONSIVIDADE */
        /* ----------------------------------------------------------------- */
        @media (max-width: 768px) {
            #relogio {
                font-size: 5em;
            }
        }

        @media (max-width: 480px) {
            #relogio {
                font-size: 3.5em;
            }
        }
    </style>
</head>
<body>

    <div id="relogio">--:--:--</div>

    <!-- Container estilo Google Clima -->
    <div id="previsao-container">
        <!-- Topo com Cidade Atual e Botão de Escolher Região -->
        <div class="topo-localizacao">
            <div class="local-info">
                📍 <span id="cidade-exibida">Barcelona - RN</span>
            </div>
            <button class="btn-escolher" onclick="toggleBusca()">Escolher região</button>
        </div>

        <!-- Input para digitar outra cidade -->
        <div id="painel-busca">
            <input type="text" id="input-cidade" placeholder="Digite a cidade (ex: São Paulo, SP)">
            <button onclick="buscarOutraCidade()">Buscar</button>
        </div>

        <h2 class="titulo-secao">Clima</h2>

        <!-- Bloco "Agora" -->
        <div class="bloco-agora">
            <div>
                <div style="font-size: 0.9em; color: #9aa0a6; margin-bottom: 4px;">Agora</div>
                <div class="temp-principal-box">
                    <span id="temp-atual" class="numero-temperatura">--</span>
                    <span id="icone-agora" class="icone-grande">🌙</span>
                </div>
            </div>
            <div class="detalhes-celestial">
                <div id="condicao-atual" class="condicao-texto">Carregando...</div>
                <div id="sensacao-termica" class="sensacao-termica">Sensação térmica: --°</div>
            </div>
        </div>

        <!-- Alerta Meteorológico Fictício/Dinâmico -->
        <div class="alerta-caixa">
            <span id="texto-alerta">⚠️ Alerta: condições estáveis na região.</span>
            <span>&gt;</span>
        </div>

        <!-- Previsão por Horas -->
        <div class="previsao-horas" id="container-horas">
            <!-- Preenchido via JS -->
        </div>

        <!-- Previsão Diária (Dias da Semana) -->
        <div class="previsao-dias" id="container-dias">
            <!-- Preenchido via JS -->
        </div>
    </div>

    <script>
        let wakeLock = null;
        let cidadeAtualNome = "Barcelona - RN";
        // Coordenadas padrão (Barcelona, RN)
        let latAtual = -6.02;
        let lonAtual = -35.93;

        // Função para atualizar o relógio (Brasília)
        function atualizarRelogio() {
            const agora = new Date();
            const opcoes = {
                timeZone: 'America/Sao_Paulo',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const horaFormatada = agora.toLocaleTimeString('pt-BR', opcoes);
            const elementoRelogio = document.getElementById('relogio');
            if (elementoRelogio) {
                elementoRelogio.textContent = horaFormatada;
            }
        }

        // Exibe ou oculta o input de busca de cidade
        function toggleBusca() {
            const painel = document.getElementById('painel-busca');
            painel.style.display = painel.style.display === 'flex' ? 'none' : 'flex';
        }

        // Busca nova cidade utilizando geocodificação aberta do Open-Meteo
        async function buscarOutraCidade() {
            const query = document.getElementById('input-cidade').value.trim();
            if (!query) return;

            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=pt&format=json`;
                const res = await fetch(geoUrl);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    const loc = data.results[0];
                    latAtual = loc.latitude;
                    lonAtual = loc.longitude;
                    cidadeAtualNome = `${loc.name}${loc.admin1 ? ' - ' + loc.admin1 : ''}`;
                    
                    document.getElementById('cidade-exibida').textContent = cidadeAtualNome;
                    document.getElementById('painel-busca').style.display = 'none';
                    document.getElementById('input-cidade').value = '';
                    
                    atualizarClima();
                } else {
                    alert('Cidade não encontrada.');
                }
            } catch (err) {
                console.error("Erro na busca de cidade:", err);
            }
        }

        // Função principal para buscar dados de clima em tempo real
        async function atualizarClima() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latAtual}&longitude=${lonAtual}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo`;

                const resposta = await fetch(url);
                const dados = await resposta.json();

                // Clima Atual
                const tempAtual = Math.round(dados.current.temperature_2m);
                const sensacao = Math.round(dados.current.apparent_temperature);
                const isDay = dados.current.is_day;
                const wcode = dados.current.weather_code;
                const infoClima = traduzirCodigoClima(wcode, isDay);

                document.getElementById('temp-atual').textContent = tempAtual;
                document.getElementById('icone-agora').textContent = infoClima.icone;
                document.getElementById('condicao-atual').textContent = infoClima.descricao;
                document.getElementById('sensacao-termica').textContent = `Sensação térmica: ${sensacao}°`;

                // Renderizar Horas (próximas 6 horas a partir da hora atual)
                const containerHoras = document.getElementById('container-horas');
                containerHoras.innerHTML = '';
                
                const horaAtualIndice = new Date().getHours();
                for (let i = 0; i < 6; i++) {
                    const indiceH = (horaAtualIndice + i) % 24;
                    const tempH = Math.round(dados.hourly.temperature_2m[indiceH] || tempAtual);
                    const codeH = dados.hourly.weather_code[indiceH] || wcode;
                    const climaH = traduzirCodigoClima(codeH, (indiceH >= 6 && indiceH <= 18 ? 1 : 0));
                    
                    const labelHora = i === 0 ? 'Agora' : `${String(indiceH).padStart(2, '0')}:00`;

                    containerHoras.innerHTML += `
                        <div class="hora-coluna">
                            <span class="temp-h">${tempH}°</span>
                            <span class="icone-h">${climaH.icone}</span>
                            <span>${labelHora}</span>
                        </div>
                    `;
                }

                // Renderizar Dias da Semana (7 dias)
                const containerDias = document.getElementById('container-dias');
                containerDias.innerHTML = '';
                
                const diasSemanaNomes = ['dom.', 'seg.', 'ter.', 'qua.', 'qui.', 'sex.', 'sáb.'];
                const hojeObj = new Date();

                for (let i = 0; i < 7; i++) {
                    const dataCard = new Date();
                    dataCard.setDate(hojeObj.getDate() + i);
                    const nomeDia = i === 0 ? diasSemanaNomes[hojeObj.getDay()] : diasSemanaNomes[dataCard.getDay()];

                    const maxD = Math.round(dados.daily.temperature_2m_max[i]);
                    const minD = Math.round(dados.daily.temperature_2m_min[i]);
                    const codeD = dados.daily.weather_code[i];
                    const climaD = traduzirCodigoClima(codeD, 1);

                    containerDias.innerHTML += `
                        <div class="dia-card ${i === 0 ? 'ativo' : ''}">
                            <span class="dia-nome">${nomeDia}</span>
                            <span class="dia-icone">${climaD.icone}</span>
                            <span class="dia-temp"><span class="max">${maxD}°</span>/<span class="min">${minD}°</span></span>
                        </div>
                    `;
                }

            } catch (erro) {
                console.error("Erro ao carregar clima:", erro);
            }
        }

        // Conversor de códigos de clima WMO para Emojis estilo Google
        function traduzirCodigoClima(code, isDay) {
            switch (code) {
                case 0: 
                    return { icone: isDay ? '☀️' : '🌙', descricao: isDay ? 'Céu limpo' : 'Céu limpo' };
                case 1:
                case 2: 
                    return { icone: isDay ? '⛅' : '☁️', descricao: 'Parcialmente nublado' };
                case 3: 
                    return { icone: '☁️', descricao: 'Nublado' };
                case 51:
                case 53:
                case 55:
                case 61:
                case 63: 
                    return { icone: '🌧️', descricao: 'Chuva leve' };
                case 65:
                case 80:
                case 81:
                case 82: 
                    return { icone: '🌧️', descricao: 'Chuva forte' };
                case 95:
                case 96:
                case 99: 
                    return { icone: '⛈️', descricao: 'Tempestade' };
                default: 
                    return { icone: isDay ? '☀️' : '🌙', descricao: 'Estável' };
            }
        }

        // -----------------------------------------------------------------
        // LÓGICA DO SCREEN WAKE LOCK
        // -----------------------------------------------------------------
        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                } catch (err) {
                    console.error(`Wake Lock erro: ${err.message}`);
                }
            }
        };

        const releaseWakeLock = () => {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        };

        // Inicialização
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        atualizarClima();
        setInterval(atualizarClima, 60000); // Atualiza dados do clima a cada 1 minuto

        requestWakeLock();
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                atualizarClima();
            } else {
                releaseWakeLock();
            }
        });
    </script>
</body>
</html>
