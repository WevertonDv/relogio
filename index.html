<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Brasília & Previsão do Tempo</title>
    <style>
        /* ----------------------------------------------------------------- */
        /* ESTILOS BASE E CENTRALIZAÇÃO */
        /* ----------------------------------------------------------------- */
        body {
            background-color: #000;
            color: #ccc; 
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        #relogio {
            color: #ffffff; 
            font-size: 8em; /* Relógio aumentado */
            font-weight: bold;
            text-shadow: 0 0 0px rgba(255, 255, 255, 0.8);
            white-space: nowrap; 
            padding: 0 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        /* ----------------------------------------------------------------- */
        /* ESTILOS DO CLIMA (ESTILO GOOGLE CLIMA ESCURO) */
        /* ----------------------------------------------------------------- */
        #previsao-container {
            background-color: #000;
            color: #fff;
            max-width: 650px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .local-data {
            font-size: 0.95em;
            color: #e0e0e0;
            margin-bottom: 12px;
        }

        .clima-principal {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .icone-temperatura-grande {
            font-size: 3.5em;
            line-height: 1;
        }

        .bloco-temp-nums {
            display: flex;
            align-items: flex-start;
            font-size: 3.5em;
            font-weight: 300;
        }

        .unidade-temp {
            font-size: 0.35em;
            margin-top: 5px;
            color: #aaa;
            font-weight: normal;
        }

        .status-chuva {
            margin-bottom: 25px;
        }

        .status-chuva .titulo-condicao {
            font-size: 1.5em;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .status-chuva .detalhes-condicao {
            font-size: 0.95em;
            color: #ccc;
        }

        /* Previsão para a semana (Grade) */
        .grade-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .dia-coluna {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85em;
        }

        .dia-nome {
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        .dia-icone {
            font-size: 1.4em;
            margin-bottom: 8px;
            min-height: 25px;
        }

        .dia-prob {
            color: #8ab4f8;
            font-size: 0.8em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .dia-temps {
            font-size: 0.8em;
            color: #bbb;
            line-height: 1.2;
        }

        .dia-temps .max {
            color: #fff;
        }

        .dia-temps .min {
            color: #999;
        }

        /* ----------------------------------------------------------------- */
        /* RESPONSIVIDADE */
        /* ----------------------------------------------------------------- */
        @media (max-width: 768px) {
            #relogio {
                font-size: 5.5em;
            }
            .grade-semana {
                overflow-x: auto;
                justify-content: space-between;
            }
            .dia-coluna {
                min-width: 65px;
            }
        }

        @media (max-width: 480px) {
            #relogio {
                font-size: 3.8em;
            }
        }
    </style>
</head>
<body>

    <div id="relogio">--:--:--</div>

    <!-- Seção de Previsão do Tempo estilo Google -->
    <div id="previsao-container">
        <div class="local-data">Domingo • Barcelona, RN</div>
        
        <div class="clima-principal">
            <div class="icone-temperatura-grande">⛅</div>
            <div class="bloco-temp-nums">
                32
                <div class="unidade-temp">°C | °F</div>
            </div>
        </div>

        <div class="status-chuva">
            <div class="titulo-condicao">Chuva leve</div>
            <div class="detalhes-condicao">Máxima: 32° &nbsp;&nbsp; Mínima: 22° &nbsp;&nbsp; Chuva: 35%</div>
        </div>

        <div class="grade-semana">
            <div class="dia-coluna">
                <span class="dia-nome">dom.</span>
                <span class="dia-icone">🌧️</span>
                <span class="dia-prob">35%</span>
                <span class="dia-temps"><span class="max">32°</span><br><span class="min">22°</span></span>
            </div>
            <div class="dia-coluna">
                <span class="dia-nome">seg.</span>
                <span class="dia-icone">🌧️</span>
                <span class="dia-prob">50%</span>
                <span class="dia-temps"><span class="max">32°</span><br><span class="min">23°</span></span>
            </div>
            <div class="dia-coluna">
                <span class="dia-nome">ter.</span>
                <span class="dia-icone">🌧️</span>
                <span class="dia-prob">50%</span>
                <span class="dia-temps"><span class="max">31°</span><br><span class="min">22°</span></span>
            </div>
            <div class="dia-coluna">
                <span class="dia-nome">qua.</span>
                <span class="dia-icone">☀️</span>
                <span class="dia-prob">10%</span>
                <span class="dia-temps"><span class="max">31°</span><br><span class="min">22°</span></span>
            </div>
            <div class="dia-coluna">
                <span class="dia-nome">qui.</span>
                <span class="dia-icone">☀️</span>
                <span class="dia-prob">30%</span>
                <span class="dia-temps"><span class="max">32°</span><br><span class="min">22°</span></span>
            </div>
            <div class="dia-coluna">
                <span class="dia-nome">sex.</span>
                <span class="dia-icone">🌧️</span>
                <span class="dia-prob">35%</span>
                <span class="dia-temps"><span class="max">32°</span><br><span class="min">22°</span></span>
            </div>
            <div class="dia-coluna">
                <span class="dia-nome">sáb.</span>
                <span class="dia-icone">⛅</span>
                <span class="dia-prob">15%</span>
                <span class="dia-temps"><span class="max">32°</span><br><span class="min">21°</span></span>
            </div>
        </div>
    </div>

    <script>
        let wakeLock = null;

        // Função para atualizar a hora (Hora de Brasília)
        function atualizarRelogio() {
            const agora = new Date();
            const opcoes = {
                timeZone: 'America/Sao_Paulo',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            const horaFormatada = agora.toLocaleTimeString('pt-BR', opcoes);
            const elementoRelogio = document.getElementById('relogio');
            if (elementoRelogio) {
                elementoRelogio.textContent = horaFormatada;
            }
        }

        // -----------------------------------------------------------------
        // LÓGICA DO SCREEN WAKE LOCK
        // -----------------------------------------------------------------
        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock Ativo!');

                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock Liberado pelo sistema.');
                        wakeLock = null;
                    });
                } catch (err) {
                    console.error(`Falha ao ativar Wake Lock: ${err.message}`);
                }
            }
        };

        const releaseWakeLock = () => {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
                console.log('Screen Wake Lock Liberado.');
            }
        };

        // -----------------------------------------------------------------
        // INICIALIZAÇÃO
        // -----------------------------------------------------------------
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        requestWakeLock();
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            } else {
                releaseWakeLock();
            }
        });
    </script>

</body>
</html>
