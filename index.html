<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Brasília & Previsão do Tempo</title>
    <style>
        /* ----------------------------------------------------------------- */
        /* ESTILOS BASE E CENTRALIZAÇÃO */
        /* ----------------------------------------------------------------- */
        body {
            background-color: #000;
            color: #ccc; 
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }

        #relogio {
            color: #ffffff; 
            font-size: 8em;
            font-weight: bold;
            text-shadow: 0 0 0px rgba(255, 255, 255, 0.8);
            white-space: nowrap; 
            padding: 0 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        /* ----------------------------------------------------------------- */
        /* ESTILOS DO CLIMA (ESTILO GOOGLE CLIMA ESCURO) */
        /* ----------------------------------------------------------------- */
        #previsao-container {
            background-color: #000;
            color: #fff;
            max-width: 650px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .local-data {
            font-size: 0.95em;
            color: #e0e0e0;
            margin-bottom: 12px;
        }

        .clima-principal {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .icone-temperatura-grande {
            font-size: 3.5em;
            line-height: 1;
        }

        .bloco-temp-nums {
            display: flex;
            align-items: flex-start;
            font-size: 3.5em;
            font-weight: 300;
        }

        .unidade-temp {
            font-size: 0.35em;
            margin-top: 5px;
            color: #aaa;
            font-weight: normal;
        }

        .status-chuva {
            margin-bottom: 25px;
        }

        .status-chuva .titulo-condicao {
            font-size: 1.5em;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .status-chuva .detalhes-condicao {
            font-size: 0.95em;
            color: #ccc;
        }

        /* Previsão para a semana (Grade) */
        .grade-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .dia-coluna {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.85em;
        }

        .dia-nome {
            color: #e0e0e0;
            margin-bottom: 8px;
        }

        .dia-icone {
            font-size: 1.4em;
            margin-bottom: 8px;
            min-height: 25px;
        }

        .dia-prob {
            color: #8ab4f8;
            font-size: 0.8em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .dia-temps {
            font-size: 0.8em;
            color: #bbb;
            line-height: 1.2;
        }

        .dia-temps .max {
            color: #fff;
        }

        .dia-temps .min {
            color: #999;
        }

        /* ----------------------------------------------------------------- */
        /* RESPONSIVIDADE */
        /* ----------------------------------------------------------------- */
        @media (max-width: 768px) {
            #relogio {
                font-size: 5.5em;
            }
            .grade-semana {
                overflow-x: auto;
                justify-content: space-between;
            }
            .dia-coluna {
                min-width: 65px;
            }
        }

        @media (max-width: 480px) {
            #relogio {
                font-size: 3.8em;
            }
        }
    </style>
</head>
<body>

    <div id="relogio">--:--:--</div>

    <!-- Seção de Previsão do Tempo estilo Google -->
    <div id="previsao-container">
        <div id="local-data" class="local-data">Carregando data...</div>
        
        <div class="clima-principal">
            <div id="icone-principal" class="icone-temperatura-grande">⏳</div>
            <div class="bloco-temp-nums">
                <span id="temp-atual">--</span>
                <div class="unidade-temp">°C | °F</div>
            </div>
        </div>

        <div class="status-chuva">
            <div id="condicao-atual" class="titulo-condicao">Atualizando clima...</div>
            <div id="detalhes-atual" class="detalhes-condicao">Máxima: --° &nbsp;&nbsp; Mínima: --° &nbsp;&nbsp; Chuva: --%</div>
        </div>

        <div class="grade-semana" id="grade-semana">
            <!-- Preenchido via JavaScript em tempo real -->
        </div>
    </div>

    <script>
        let wakeLock = null;

        // Função para atualizar a hora (Hora de Brasília)
        function atualizarRelogio() {
            const agora = new Date();
            const opcoes = {
                timeZone: 'America/Sao_Paulo',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            const horaFormatada = agora.toLocaleTimeString('pt-BR', opcoes);
            const elementoRelogio = document.getElementById('relogio');
            if (elementoRelogio) {
                elementoRelogio.textContent = horaFormatada;
            }
        }

        // Função para buscar dados meteorológicos reais de Barcelona, RN via Open-Meteo API
        async function atualizarClima() {
            try {
                // Coordenadas aproximadas para Barcelona, RN (-6.02, -35.93)
                const latitude = -6.02;
                const longitude = -35.93;
                
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo`;

                const resposta = await fetch(url);
                const dados = await resposta.json();

                // Atualizar Data atual formatada (Ex: "Domingo • Barcelona, RN")
                const hojeObj = new Date();
                const diasSemanaExtenso = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
                const nomeDiaHoje = diasSemanaExtenso[hojeObj.getDay()];
                document.getElementById('local-data').textContent = `${nomeDiaHoje} • Barcelona, RN`;

                // Dados Atuais
                const tempAtual = Math.round(dados.current.temperature_2m);
                const wcode = dados.current.weather_code;
                const infoClima = traduzirCodigoClima(wcode);

                document.getElementById('temp-atual').textContent = tempAtual;
                document.getElementById('icone-principal').textContent = infoClima.icone;
                document.getElementById('condicao-atual').textContent = infoClima.descricao;

                // Pegar máximas e mínimas do dia atual
                const maxHoje = Math.round(dados.daily.temperature_2m_max[0]);
                const minHoje = Math.round(dados.daily.temperature_2m_min[0]);
                const chuvaHoje = dados.daily.precipitation_probability_max[0] ?? 0;

                document.getElementById('detalhes-atual').innerHTML = `Máxima: ${maxHoje}° &nbsp;&nbsp; Mínima: ${minHoje}° &nbsp;&nbsp; Chuva: ${chuvaHoje}%`;

                // Previsão dos 7 dias da semana
                const gradeSemana = document.getElementById('grade-semana');
                gradeSemana.innerHTML = '';

                const diasCurtos = ['dom.', 'seg.', 'ter.', 'qua.', 'qui.', 'sex. कहें', 'sáb.'];
                
                for (let i = 0; i < 7; i++) {
                    const dataIndice = new Date();
                    dataIndice.setDate(hojeObj.getDate() + i);
                    const diaSemanaStr = ['dom.', 'seg.', 'ter.', 'qua.', 'qui.', 'sex.', 'sáb.'][dataIndice.getDay()];

                    const codeDia = dados.daily.weather_code[i];
                    const climaDia = traduzirCodigoClima(codeDia);
                    const maxDia = Math.round(dados.daily.temperature_2m_max[i]);
                    const minDia = Math.round(dados.daily.temperature_2m_min[i]);
                    const probChuvaDia = dados.daily.precipitation_probability_max[i] ?? 0;

                    const colunaHtml = `
                        <div class="dia-coluna">
                            <span class="dia-nome">${i === 0 ? 'hoje' : diaSemanaStr}</span>
                            <span class="dia-icone">${climaDia.icone}</span>
                            <span class="dia-prob">${probChuvaDia}%</span>
                            <span class="dia-temps"><span class="max">${maxDia}°</span><br><span class="min">${minDia}°</span></span>
                        </div>
                    `;
                    gradeSemana.innerHTML += colunaHtml;
                }

            } catch (erro) {
                console.error("Erro ao atualizar o clima:", erro);
            }
        }

        // Tradutor de códigos meteorológicos padrão da WMO para Emojis e Descrições em PT
        function traduzirCodigoClima(code) {
            switch (code) {
                case 0: return { icone: '☀️', descricao: 'Céu limpo' };
                case 1:
                case 2: return { icone: '⛅', descricao: 'Parcialmente nublado' };
                case 3: return { icone: '☁️', descricao: 'Nublado' };
                case 51:
                case 53:
                case 55:
                case 61:
                case 63: return { icone: '🌧️', descricao: 'Chuva leve' };
                case 65:
                case 80:
                case 81:
                case 82: return { icone: '🌧️', descricao: 'Chuva forte' };
                case 95:
                case 96:
                case 99: return { icone: '⛈️', descricao: 'Tempestade' };
                default: return { icone: '⛅', descricao: 'Estável' };
            }
        }

        // -----------------------------------------------------------------
        // LÓGICA DO SCREEN WAKE LOCK
        // -----------------------------------------------------------------
        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock Ativo!');

                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock Liberado pelo sistema.');
                        wakeLock = null;
                    });
                } catch (err) {
                    console.error(`Falha ao ativar Wake Lock: ${err.message}`);
                }
            }
        };

        const releaseWakeLock = () => {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
                console.log('Screen Wake Lock Liberado.');
            }
        };

        // -----------------------------------------------------------------
        // INICIALIZAÇÃO
        // -----------------------------------------------------------------
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        // Busca o clima imediatamente ao carregar e configura para atualizar a cada 1 minuto (60000 ms)
        atualizarClima();
        setInterval(atualizarClima, 60000);

        requestWakeLock();
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                atualizarClima(); // Atualiza também ao retornar para a aba
            } else {
                releaseWakeLock();
            }
        });
    </script>

</body>
</html>
